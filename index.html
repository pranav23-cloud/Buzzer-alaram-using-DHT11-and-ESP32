<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ESP32 Temperature Monitor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌡️ ESP32 Temperature Monitor</h1>

        <p class="subtitle">
            DHT11 + USB Serial + Buzzer
        </p>

        <div class="connection">
            <span id="connectionDot"></span>
            <span id="connectionText">Not Connected</span>
        </div>

        <button id="connectButton">
            Connect ESP32
        </button>

        <div class="temperature-card">

            <p class="label">Current Temperature</p>

            <div class="temperature">
                <span id="temperature">--</span>
                <span>°C</span>
            </div>

        </div>

        <div class="limit-card">

            <p class="label">Temperature Limit</p>

            <div class="limit-input">

                <input
                    type="number"
                    id="limitInput"
                    value="29"
                    step="0.1"
                >

                <span>°C</span>

            </div>

            <button id="setLimitButton">
                Set Temperature Limit
            </button>

            <p id="limitStatus">
                Current limit: 29°C
            </p>

        </div>

        <div id="statusCard" class="status normal">

            <div id="statusIcon">🟢</div>

            <div>

                <h2 id="statusTitle">
                    NORMAL
                </h2>

                <p id="statusMessage">
                    Temperature is normal
                </p>

            </div>

        </div>

        <div class="info">

            <p>
                <strong>Sensor:</strong> DHT11
            </p>

            <p>
                <strong>Buzzer:</strong>
                <span id="buzzerStatus">OFF</span>
            </p>

            <p>
                <strong>Communication:</strong>
                USB Serial
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
